name: Update GitHub Profile

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow

      - name: Fetch contributions
        run: python scripts/heatmap/fetch_contributions.py

      - name: Render heatmap
        run: python scripts/heatmap/render_heatmap_svg.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/output/contrib-heatmap.svg data/contributions.json

          git diff --cached --quiet || git commit -m "Update contribution heatmap"

          git push
